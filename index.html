<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Музыка всегда с собой</title>
<meta name="description" content="Музыкальный плеер и радио — бесплатная музыка на любом устройстве">
<meta name="theme-color" content="#ff5c8a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f2ff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Музыка">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>♪</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14101f;--bg2:#1e1830;--tx:#f3eeff;--mu:#9b91b8;--ac:#ff5c8a;--ln:rgba(255,255,255,.09)}
@media (prefers-color-scheme:light){:root{--bg:#f6f2ff;--bg2:#ebe4fb;--tx:#1b1530;--mu:#6d6488;--ln:rgba(0,0,0,.1)}}
*{box-sizing:border-box;margin:0}
body{
  background:
    radial-gradient(circle at 50% 35%, transparent 0, transparent 80px, rgba(0,0,0,0) 81px),
    repeating-conic-gradient(from 0deg at 50% 35%, transparent 0deg, transparent 6deg, rgba(0,0,0,0.28) 6deg, rgba(0,0,0,0.28) 9deg),
    radial-gradient(120% 90% at 50% 35%, var(--bg2), var(--bg));
  background-attachment: fixed;
  color:var(--tx);
  font:400 15px/1.45 Manrope,system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 190px;
  overscroll-behavior:none;
}
h1,h2{font-family:Unbounded,Manrope,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #5cc8ff;outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
.hero{margin:14px 0 26px;border-radius:32px;background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg));border:1px solid var(--ln);text-align:center;padding:14px 18px 28px}
canvas{width:100%;height:210px;display:block}
.hero h1{font-size:26px;letter-spacing:-.02em}
.hero p{color:var(--mu);margin:6px 0 18px}
.wave{background:var(--ac);color:#fff;font-weight:700;padding:14px 34px;border-radius:99px;font-size:16px;box-shadow:0 10px 30px -8px var(--ac)}
.moods{display:flex;gap:8px;overflow-x:auto;margin-top:18px;padding-bottom:4px}
.moods button{white-space:nowrap;padding:8px 15px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);font-weight:600}
.moods button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
h2{font-size:17px;margin:8px 0 10px}
.row{padding:6px 8px;border-radius:16px}
.row:hover,.row.cur{background:var(--bg2)}
.rowmain{display:flex;align-items:center;gap:13px;cursor:pointer;padding:3px 0}
.ext{display:flex;align-items:center;gap:8px;padding:2px 0 2px 65px}
.extlink{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}
.extlink.ya:hover{border-color:#ffcc00;color:#ffcc00}
.extlink.vk:hover{border-color:#5181b8;color:#5181b8}
.cv{flex:none;width:52px;height:52px;border-radius:14px;background:var(--bg2) center/cover}
.m{flex:1;min-width:0}.m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m span{color:var(--mu);font-size:13px}
.hb{font-size:20px;color:var(--mu);padding:8px}.hb.on{color:var(--ac)}
.tm{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.sr{width:100%;padding:15px 20px;border-radius:99px;border:1px solid var(--ln);background:var(--bg2);color:var(--tx);font:inherit;margin:14px 0}
.empty{color:var(--mu);padding:22px 8px;text-align:center}
.card{background:var(--bg2);border-radius:24px;padding:22px;margin:24px 0}
.card a{color:var(--ac)}
.nav{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--ln);z-index:5}
.nav .in{max-width:720px;margin:0 auto;display:flex}
.nav button{flex:1;padding:11px 0 8px;color:var(--mu);font-weight:600;font-size:12px}
.nav button.on{color:var(--tx)}
.nav button::after{content:"";display:block;width:18px;height:3px;border-radius:3px;margin:4px auto 0}
.nav button.on::after{background:var(--ac)}
.pl{position:fixed;left:10px;right:10px;bottom:calc(58px + env(safe-area-inset-bottom));max-width:700px;margin:0 auto;z-index:6;border-radius:24px;padding:12px 14px 10px;color:#fff;background:linear-gradient(120deg,#ff5c8a,#7a4dff);box-shadow:0 18px 40px -12px rgba(0,0,0,.55)}
.pl .t{display:flex;align-items:center;gap:12px}
.pl .cv{width:46px;height:46px}.pl .m span{color:rgba(255,255,255,.8)}
.ct{display:flex;align-items:center}.ct button{font-size:20px;padding:8px 9px}
.ct .pp{background:#fff;color:#14101f;border-radius:50%;width:46px;height:46px;font-size:18px;padding:0}
.pg{display:flex;align-items:center;gap:9px;margin-top:8px;font-size:12px;font-variant-numeric:tabular-nums}
.pg input{flex:1;accent-color:#fff;min-height:28px}
.install-bar{position:fixed;top:0;left:0;right:0;z-index:99;padding:12px 18px;background:linear-gradient(135deg,#ff5c8a,#7a4dff);color:#fff;font-weight:600;font-size:14px;display:none;align-items:center;justify-content:space-between;gap:12px}
.install-bar.show{display:flex}
.install-bar button{padding:8px 18px;border-radius:99px;background:#fff;color:#7a4dff;font-weight:700}
.install-bar .x{background:none;color:#fff;font-size:22px;padding:4px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100;padding:10px 22px;border-radius:99px;background:var(--bg2);color:var(--tx);font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.vol-row{display:flex;align-items:center;gap:10px;margin-top:18px;padding:10px 0;font-size:12px}
.vol-row input{flex:1;accent-color:#fff;min-height:28px}

.mode-btn{font-size:16px;padding:6px 8px;opacity:.5;transition:opacity .2s}
.mode-btn.on{opacity:1;color:#fff}
.skel{background:linear-gradient(90deg,var(--bg2) 25%,var(--ln) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px;height:64px;margin:6px 0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pager{display:flex;justify-content:center;gap:8px;margin:16px 0}
.pager button{padding:8px 16px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);font-weight:600}
.pager button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.hist-tag{display:inline-block;padding:4px 12px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);font-size:13px;margin:3px;cursor:pointer}
.hist-tag:hover{border-color:var(--ac);color:var(--ac)}
/* Radio styles */
.radio-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.radio-card{background:var(--bg2);border-radius:20px;padding:20px 16px;text-align:center;cursor:pointer;border:2px solid var(--ln);transition:border-color .2s,transform .15s}
.radio-card:hover{border-color:var(--ac);transform:scale(1.02)}
.radio-card.playing{border-color:var(--ac);box-shadow:0 0 20px -4px var(--ac)}
.radio-card .ricon{font-size:40px;margin-bottom:8px}
.radio-card .rname{font-weight:700;font-size:15px;margin-bottom:4px}
.radio-card .rdesc{color:var(--mu);font-size:12px}
.radio-live{display:inline-block;background:var(--ac);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;margin-left:6px;animation:pulse-live 1.5s infinite}
@keyframes pulse-live{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>

<div class="install-bar" id="installBar">
  <span>♪ Установите приложение на устройство</span>
  <button id="installBtn">Установить</button>
  <button class="x" id="installX">&times;</button>
</div>

<div class="toast" id="toast"></div>

<div class="wrap">
  <section class="hero" id="hero">
    <canvas id="cv" width="640" height="420"></canvas>
    <h1>Моя волна</h1>
    <p id="sub">Полные треки и радио — бесплатно и легально</p>
    <button class="wave" id="waveBtn">Слушать бесплатно</button>
    <div class="moods" id="moods"></div>
  </section>
  <div id="view"></div>
</div>

<div class="pl" id="pl">
  <div class="t">
    <div class="cv" id="pcv"></div>
    <div class="m"><b id="pt">Ничего не играет</b><span id="pa">Выберите трек</span></div>
    <button class="hb" id="plike" style="color:#fff" aria-label="В любимое">♡</button>
    <div class="ct">
      <button class="mode-btn" id="shuffleBtn" title="Перемешать">🔀</button>
      <button id="prev" aria-label="Назад">⏮</button>
      <button class="pp" id="pp" aria-label="Играть/Пауза">▶</button>
      <button id="next" aria-label="Вперёд">⏭</button>
      <button class="mode-btn" id="repeatBtn" title="Повтор">🔁</button>
    </div>
  </div>
  <div class="pg"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка"><span id="dur">0:00</span></div>
  <div class="vol-row"><span>🔊</span><input type="range" id="vol" min="0" max="100" value="80" aria-label="Громкость"><span id="volVal">80%</span></div>

</div>

<nav class="nav"><div class="in">
  <button data-v="home" class="on">Главное</button><button data-v="search">Поиск</button><button data-v="radio">Радио</button><button data-v="fav">♡</button><button data-v="hist">История</button>
</div></nav>

<script>
/* === Jamendo API — полные треки, бесплатно и легально (Creative Commons) === */
const JAMENDO_CLIENT_ID = "32d7ec41";
const API = "https://api.jamendo.com/v3.0";
const GENRES = {"Все":"","Поп":"pop","Рэп":"hiphop","Рок":"rock","Электроника":"electronic","R&B":"rnb","Альтернатива":"alternative","Джаз":"jazz","Классика":"classical","Лаунж":"lounge","Фолк":"folk","Метал":"metal","Реггетон":"reggae","Танцевальная":"dance","Саундтрек":"soundtrack","Мир":"world","Инструментал":"instrumental"};
const PER_PAGE = 20;
const RADIOS = [
  {id:"roksana",name:"Радио Роксана",icon:"📻",desc:"Лирические хиты 24/7",src:"http://listen9.myradio24.com/2761",img:""},
  {id:"rusradio",name:"Русское Радио",icon:"🇷🇺",desc:"Всё будет хорошо!",src:"http://23.105.238.4/rusradio128.mp3",img:""}
];
const au = new Audio();
const $ = id => document.getElementById(id);
const fmt = s => isFinite(s) ? Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0") : "0:00";
const ls = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };

let mood = "Все", view = "home", list = [], queue = [], cur = -1, radio = false, liveRadio = null;
let favs = ls.get("m-favs",{}), hist = ls.get("m-hist",[]);
let page = 0, totalLoaded = 0, allTracks = [];
let repeatMode = 0, shuffleOn = false;



/* === Громкость === */
au.volume = 0.8;
$("vol").oninput = e => { au.volume = e.target.value/100; $("volVal").textContent = e.target.value+"%" };

/* === Повтор и перемешивание === */
$("repeatBtn").onclick = () => { repeatMode = (repeatMode+1)%3; $("repeatBtn").classList.toggle("on",repeatMode>0); $("repeatBtn").textContent = repeatMode===2?"🔂":"🔁"; toast(repeatMode===0?"Повтор выкл":repeatMode===1?"Повтор всех":"Повтор одного") };
$("shuffleBtn").onclick = () => { shuffleOn = !shuffleOn; $("shuffleBtn").classList.toggle("on",shuffleOn); toast(shuffleOn?"Перемешивание вкл":"Перемешивание выкл") };

/* === Toast === */
let toastTimer;
function toast(msg){ $("toast").textContent=msg; $("toast").classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2000) }

/* === Jamendo API === */
async function jamendoFetch(endpoint){
  const r = await fetch(API+"/"+endpoint+"&client_id="+JAMENDO_CLIENT_ID+"&format=json&audioformat=mp32&include=musicinfo");
  return r.json();
}
async function loadChart(genre){
  const tag = genre ? `&fuzzytags=${encodeURIComponent(genre)}` : "";
  const data = await jamendoFetch("tracks/?limit=50&order=popularity_total"+tag);
  return (data.results||[]).map(t=>({id:String(t.id),t:t.name,a:t.artist_name,img:t.image,src:t.audio,d:Number(t.duration)}));
}
async function loadSearch(query){
  const data = await jamendoFetch("tracks/?limit=50&search="+encodeURIComponent(query));
  return (data.results||[]).map(t=>({id:String(t.id),t:t.name,a:t.artist_name,img:t.image,src:t.audio,d:Number(t.duration)}));
}
const feed = () => loadChart(GENRES[mood]||"");

/* === Skeleton loading === */
function skeletons(n){ return Array(n).fill('<div class="skel"></div>').join("") }
function paginatedList(arr, pg){ return arr.slice(pg*PER_PAGE, (pg+1)*PER_PAGE) }

/* === Рендер строк === */
function rows(arr){
  if(!arr.length) return '<p class="empty">Ничего не найдено. Попробуйте другой запрос.</p>';
  return arr.map((x,i)=>`<div class="row" data-i="${i}" tabindex="0" role="button"><div class="rowmain" data-i="${i}"><div class="cv" style="background-image:url('${x.img}')"></div><div class="m"><b>${esc(x.t)}</b><span>${esc(x.a)}</span></div><span class="tm">${fmt(x.d)}</span></div><div class="ext"><a class="extlink ya" href="${ymUrl(x)}" target="_blank" rel="noopener">Яндекс</a><a class="extlink vk" href="${vkUrl(x)}" target="_blank" rel="noopener">VK</a><button class="hb ${favs[x.id]?"on":""}" data-like="${i}" aria-label="В любимое">${favs[x.id]?"♥":"♡"}</button></div></div>`).join("");
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function ymUrl(x){return "https://music.yandex.ru/search?text="+encodeURIComponent(x.a+" "+x.t)}
function vkUrl(x){return "https://vk.com/audio?q="+encodeURIComponent(x.a+" "+x.t)}

/* === Основной рендер === */
async function render(){
  $("hero").style.display = view==="home" ? "" : "none";
  const v = $("view");
  if(view==="home"){
    v.innerHTML = '<h2>'+(mood==="Все"?"Популярное сейчас":mood)+'</h2>'+skeletons(6);
    try{ allTracks = await feed(); totalLoaded = allTracks.length; page = 0; }catch(e){ v.innerHTML='<p class="empty">Не удалось загрузить каталог. Проверьте интернет.</p>'; return }
    list = paginatedList(allTracks, page);
    v.innerHTML = '<h2>'+(mood==="Все"?"Популярное сейчас":mood)+'</h2>'+rows(list)+pagerHTML();
    bindPager();
  } else if(view==="search"){
    v.innerHTML = '<input class="sr" id="q" type="search" placeholder="Трек, исполнитель, жанр" autocomplete="off"><div id="res"><p class="empty">Начните вводить название или имя артиста.</p></div>';
    let t; $("q").oninput = e => { clearTimeout(t); const s=e.target.value.trim(); t=setTimeout(async()=>{ if(!s) return; $("res").innerHTML=skeletons(4); try{ allTracks=await loadSearch(s); totalLoaded=allTracks.length; page=0; list=paginatedList(allTracks,page); $("res").innerHTML=rows(list)+pagerHTML(); bindPager(); if(!hist.includes(s)){hist.unshift(s);if(hist.length>30)hist.pop();ls.set("m-hist",hist)} }catch(err){ $("res").innerHTML='<p class="empty">Ошибка поиска: '+esc(err.message)+'</p>' } },350) };
  } else if(view==="radio"){
    v.innerHTML = '<h2>📻 Радио</h2><div class="radio-grid">'+RADIOS.map(r=>`<div class="radio-card${liveRadio===r.id?" playing":""}" data-radio="${r.id}"><div class="ricon">${r.icon}</div><div class="rname">${esc(r.name)}${liveRadio===r.id?'<span class="radio-live">LIVE</span>':''}</div><div class="rdesc">${esc(r.desc)}</div></div>`).join("")+'</div><p style="color:var(--mu);font-size:13px;margin-top:12px;text-align:center">Нажмите на станцию — радио начнёт играть</p>';
    v.querySelectorAll(".radio-card").forEach(c => c.onclick = () => {
      const rid = c.dataset.radio;
      const r = RADIOS.find(x=>x.id===rid);
      if(!r) return;
      if(liveRadio === rid){ au.pause(); liveRadio=null; $("pt").textContent="Ничего не играет"; $("pa").textContent="Выберите трек"; $("pp").textContent="▶"; /* === Dynamic sky theme based on time of day === */
function applySkyTheme(){
  const h = new Date().getHours();
  let theme;
  if(h>=5 && h<11){
    // Morning: рассвет с солнцем — soft pink-orange sunrise
    theme = {
      skyTop:'#ff9e7d', skyBottom:'#ffd29e',
      sunColor:'#ff6b35', sunGlow:'rgba(255,150,80,0.6)',
      stripeColor:'rgba(255,200,150,0.4)',
      bg:'#ff9e7d', bg2:'#ffd29e', tx:'#3a1a0a', mu:'#6a3a1a',
      ac:'#ff5c8a', ln:'rgba(80,40,20,0.15)'
    };
  } else if(h>=11 && h<17){
    // Day: просто солнышко — bright blue sky with yellow sun
    theme = {
      skyTop:'#4a9fff', skyBottom:'#a3d5ff',
      sunColor:'#ffeb3b', sunGlow:'rgba(255,235,59,0.7)',
      stripeColor:'rgba(255,255,255,0.3)',
      bg:'#4a9fff', bg2:'#a3d5ff', tx:'#0a1a3a', mu:'#2a4a7a',
      ac:'#ff5c8a', ln:'rgba(255,255,255,0.2)'
    };
  } else if(h>=17 && h<21){
    // Evening: закат — deep orange-red sunset
    theme = {
      skyTop:'#c43e3e', skyBottom:'#ff7e5f',
      sunColor:'#ff3c1f', sunGlow:'rgba(255,80,40,0.7)',
      stripeColor:'rgba(80,15,25,0.6)',
      bg:'#c43e3e', bg2:'#ff7e5f', tx:'#fff0e8', mu:'#ffd0c0',
      ac:'#ff5c8a', ln:'rgba(255,255,255,0.12)'
    };
  } else {
    // Night: тёмная ночь с луной — dark night with moon
    theme = {
      skyTop:'#0a0a1f', skyBottom:'#1a1a3a',
      sunColor:'#e8e8ff', sunGlow:'rgba(200,200,255,0.4)',
      stripeColor:'rgba(80,80,140,0.4)',
      bg:'#0a0a1f', bg2:'#1a1a3a', tx:'#e8e8ff', mu:'#8888bb',
      ac:'#7c8cff', ln:'rgba(255,255,255,0.08)'
    };
  }
  const r = document.documentElement.style;
  r.setProperty('--bg', theme.bg);
  r.setProperty('--bg2', theme.bg2);
  r.setProperty('--tx', theme.tx);
  r.setProperty('--mu', theme.mu);
  r.setProperty('--ac', theme.ac);
  r.setProperty('--ln', theme.ln);
  r.setProperty('--sun-color', theme.sunColor);
  r.setProperty('--sun-glow', theme.sunGlow);
  r.setProperty('--stripe-color', theme.stripeColor);
  r.setProperty('--sky-top', theme.skyTop);
  r.setProperty('--sky-bottom', theme.skyBottom);
}
applySkyTheme();
// Update every 5 minutes in case user keeps app open
setInterval(applySkyTheme, 5*60*1000);

render(); toast("⏹ Радио остановлено"); return }
      liveRadio = rid; radio = false; cur = -1; queue = [];
      au.src = r.src; au.play().catch(()=>{});
      $("pt").textContent = r.name; $("pa").textContent = "LIVE · "+r.desc;
      $("pcv").style.backgroundImage = ""; $("dur").textContent = "LIVE";
      $("pp").textContent = "❚❚"; $("plike").textContent = "♡";
      if("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({title:r.name,artist:"Radio Live"});
      render();
      toast("📻 "+r.name);
    });
  } else if(view==="fav"){
    allTracks = Object.values(favs);
    page = 0; list = paginatedList(allTracks, page);
    v.innerHTML = '<h2>Любимое</h2>'+(list.length?rows(list):'<p class="empty">Нажмите ♡ у трека — он появится здесь.</p>');
  } else if(view==="hist"){
    v.innerHTML = '<h2>История</h2>'+(hist.length?hist.map(h=>`<span class="hist-tag" data-q="${esc(h)}">${esc(h)}</span>`).join(""):'<p class="empty">Здесь появятся ваши поисковые запросы.</p>');
    v.querySelectorAll(".hist-tag").forEach(t => t.onclick = () => { view="search"; document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==="search")); render(); setTimeout(()=>{const q=$("q");if(q){q.value=t.dataset.q;q.dispatchEvent(new Event("input"))}},50) });
  }
}

/* === Пагинация === */
function pagerHTML(){
  if(totalLoaded<=PER_PAGE) return "";
  const pages = Math.ceil(totalLoaded/PER_PAGE);
  let h = '<div class="pager">';
  for(let i=0;i<pages&&i<8;i++) h += `<button class="${i===page?"on":""}" data-p="${i}">${i+1}</button>`;
  h += '</div>';
  return h;
}
function bindPager(){
  document.querySelectorAll(".pager button").forEach(b => b.onclick = () => { page=+b.dataset.p; list=paginatedList(allTracks,page); const v=$("view"); const existing=v.querySelector("h2"); v.innerHTML=""; if(existing)v.prepend(existing); v.innerHTML+=rows(list)+pagerHTML(); bindPager(); scrollTo(0,0) });
}

/* === Воспроизведение === */
function play(i, from){
  if(from) queue = from;
  cur = i; const x = queue[cur];
  liveRadio = null;
  au.src = x.src; au.play().catch(()=>{});
  $("pt").textContent = x.t; $("pa").textContent = x.a + (radio?" · Моя волна":"");
  $("pcv").style.backgroundImage = `url('${x.img}')`; $("dur").textContent = fmt(x.d);
  $("plike").textContent = favs[x.id]?"♥":"♡";
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("cur",queue[+r.dataset.i]&&queue[+r.dataset.i].id===x.id&&queue===list));
  if("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({title:x.t,artist:x.a,artwork:[{src:x.img,sizes:"250x250"}]});
  const q = x.a+" "+x.t;
  if(!hist.includes(q)){ hist.unshift(q); if(hist.length>30) hist.pop(); ls.set("m-hist",hist) }
  toast("▶ "+x.t);
}
function step(d){
  if(!queue.length) return;
  if(repeatMode===2){ au.currentTime=0; au.play(); return }
  let next;
  if(shuffleOn){ next=Math.floor(Math.random()*queue.length) }
  else { next = radio ? Math.floor(Math.random()*queue.length) : (cur+d+queue.length)%queue.length }
  play(next);
}
function toggleLike(x){ favs[x.id]?delete favs[x.id]:favs[x.id]=x; ls.set("m-favs",favs); toast(favs[x.id]?"♥ Добавлено в любимое":"Убрано из любимого") }

/* === События плеера === */
au.onplay = au.onpause = () => { $("pp").textContent = au.paused?"▶":"❚❚"; $("waveBtn").textContent = radio&&!au.paused?"Пауза":"Слушать бесплатно" };
au.ontimeupdate = () => { if(liveRadio) return; $("cur").textContent=fmt(au.currentTime); if(au.duration){ $("seek").value=au.currentTime/au.duration*1000; $("dur").textContent=fmt(au.duration) } };
au.onended = () => { if(liveRadio){au.play();return} if(repeatMode===2){au.currentTime=0;au.play();return} step(1) };
au.onerror = () => { if(liveRadio){toast("⚠ Поток радио прерван");liveRadio=null;render();return} if(queue.length>1) step(1) };
$("seek").oninput = e => { if(liveRadio) return; if(au.duration) au.currentTime = e.target.value/1000*au.duration };
$("pp").onclick = () => { if(liveRadio){au.paused?au.play():au.pause();return} if(cur<0){ if(list.length) play(0,list) } else au.paused?au.play():au.pause() };
$("next").onclick = () => { if(liveRadio) return; step(1) }; $("prev").onclick = () => { if(liveRadio) return; step(-1) };
$("plike").onclick = () => { if(cur<0||liveRadio) return; toggleLike(queue[cur]); $("plike").textContent=favs[queue[cur].id]?"♥":"♡"; if(view==="fav") render() };
$("waveBtn").onclick = async () => {
  if(radio && cur>=0){ au.paused?au.play():au.pause(); return }
  radio = true; liveRadio = null; try{ const pool = list.length?list:await feed(); list = pool; play(Math.floor(Math.random()*pool.length), pool) }catch{}
};

/* === Клик по треку / лайк === */
document.addEventListener("click", e => {
  const l = e.target.closest("[data-like]");
  if(l){ toggleLike(list[+l.dataset.like]); render(); return }
  const r = e.target.closest(".rowmain");
  if(r){ radio=false; liveRadio=null; play(+r.dataset.i, list) }
});
document.addEventListener("keydown", e => { if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("rowmain")){ e.preventDefault(); e.target.click() } });

/* === Навигация === */
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => { view=b.dataset.v; document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x===b)); render(); scrollTo(0,0) });

/* === Настроения === */
$("moods").innerHTML = Object.keys(GENRES).map(m=>`<button class="${m===mood?"on":""}">${m}</button>`).join("");
$("moods").onclick = e => { const b=e.target.closest("button"); if(!b) return; mood=b.textContent; radio=false; liveRadio=null; list=[]; $("moods").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); render() };

/* === Свайпы === */
let touchStartX = 0;
document.addEventListener("touchstart", e => { touchStartX = e.touches[0].clientX }, {passive:true});
document.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 80 && cur >= 0 && !liveRadio){ if(dx > 0) step(-1); else step(1) }
});

/* === Визуализатор === */
const c=$("cv"),g=c.getContext("2d");let ph=0,amp=0;
(function draw(){
  requestAnimationFrame(draw); if(view!=="home") return;
  const W=c.width,H=c.height; g.clearRect(0,0,W,H);
  const on=!au.paused; ph+=on?.02:.005; amp+=((on?1:.2)-amp)*.05;
  const hue = cur>=0 ? (parseInt(queue[cur].id,10)*47)%360 : 335;
  const beat = on ? (Math.sin(ph*9)*.5+.5)*.4 : 0;
  for(let k=3;k>=0;k--){
    g.beginPath();
    for(let i=0;i<=96;i++){
      const t=i/96*Math.PI*2, r=88+beat*22+k*15+Math.sin(t*3+ph*2+k)*(5+amp*18)+Math.cos(t*5-ph)*(3+amp*9);
      const px=W/2+Math.cos(t)*r*1.35, py=H/2+Math.sin(t)*r*.92; i?g.lineTo(px,py):g.moveTo(px,py);
    }
    g.closePath(); g.fillStyle=`hsla(${(hue+k*22)%360},90%,62%,${k===0?.95:.13})`; g.fill();
  }
})();

/* === PWA Install === */
let deferredPrompt;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt=e; $("installBar").classList.add("show") });
$("installBtn").onclick = async () => { if(deferredPrompt){ deferredPrompt.prompt(); const r=await deferredPrompt.userChoice; if(r.outcome==="accepted") toast("Приложение установлено!"); deferredPrompt=null } $("installBar").classList.remove("show") };
$("installX").onclick = () => $("installBar").classList.remove("show");

/* === Service Worker === */
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").then(()=>console.log("SW ok")).catch(()=>console.log("SW fail")) }

render();
</script>
</body>
