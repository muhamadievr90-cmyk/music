<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14101f;--bg2:#1e1830;--tx:#f3eeff;--mu:#9b91b8;--ac:#ff5c8a;--ln:rgba(255,255,255,.09)}
.src-toggle{margin-left:auto;padding:6px 12px;background:var(--bg2);border:1px solid var(--ac);color:var(--ac);border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.src-toggle:active{transform:scale(.95)}
.src-toggle.audius{background:var(--ac);color:#fff}
@media (prefers-color-scheme:light){:root{--bg:#f6f2ff;--bg2:#ebe4fb;--tx:#1b1530;--mu:#6d6488;--ln:rgba(0,0,0,.1)}}
*{box-sizing:border-box;margin:0}
body{
  background:
    var(--pat, repeating-conic-gradient(from 0deg at 50% 35%, transparent 0deg, transparent 6deg, rgba(0,0,0,0.28) 6deg, rgba(0,0,0,0.28) 9deg)),
    radial-gradient(120% 90% at 50% 35%, var(--bg2), var(--bg));
  background-attachment: fixed;
  color:var(--tx);
  font:400 15px/1.45 Manrope,system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 190px;
  overscroll-behavior:none;
}
h1,h2{font-family:Unbounded,Manrope,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #5cc8ff;outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
.hero{margin:14px 0 26px;border-radius:32px;background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg));border:1px solid var(--ln);text-align:center;padding:14px 18px 28px}
canvas{width:100%;height:210px;display:block}
.hero h1{font-size:26px;letter-spacing:-.02em}
.hero p{color:var(--mu);margin:6px 0 18px}
.wave{background:var(--ac);color:#fff;font-weight:700;padding:14px 34px;border-radius:99px;font-size:16px;box-shadow:0 10px 30px -8px var(--ac)}
.moods{display:flex;gap:8px;overflow-x:auto;margin-top:18px;padding-bottom:4px}
.moods button{white-space:nowrap;padding:8px 15px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);font-weight:600}
.moods button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
h2{font-size:17px;margin:8px 0 10px}
.row{padding:6px 8px;border-radius:16px}
.row:hover,.row.cur{background:var(--bg2)}
.rowmain{display:flex;align-items:center;gap:13px;cursor:pointer;padding:3px 0}
.ext{display:flex;align-items:center;gap:8px;padding:2px 0 2px 65px}
.extlink{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}
.extlink.ya:hover{border-color:#ffcc00;color:#ffcc00}
.extlink.vk:hover{border-color:#5181b8;color:#5181b8}
.cv{flex:none;width:52px;height:52px;border-radius:14px;background:var(--bg2) center/cover}
.m{flex:1;min-width:0}.m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m span{color:var(--mu);font-size:13px}
.hb{font-size:20px;color:var(--mu);padding:8px}.hb.on{color:var(--ac)}
.tm{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.sr{width:100%;padding:15px 20px;border-radius:99px;border:1px solid var(--ln);background:var(--bg2);color:var(--tx);font:inherit;margin:14px 0}
.empty{color:var(--mu);padding:22px 8px;text-align:center}
.card{background:var(--bg2);border-radius:24px;padding:22px;margin:24px 0}
.card a{color:var(--ac)}
.nav{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--ln);z-index:5}
.nav .in{max-width:720px;margin:0 auto;display:flex;overflow-x:auto}
.nav button{flex:1 0 auto;white-space:nowrap;padding:11px 8px 8px;color:var(--mu);font-weight:600;font-size:12px}
.nav button.on{color:var(--tx)}
.nav button::after{content:"";display:block;width:18px;height:3px;border-radius:3px;margin:4px auto 0}
.nav button.on::after{background:var(--ac)}
.pl{position:fixed;left:10px;right:10px;bottom:calc(58px + env(safe-area-inset-bottom));max-width:700px;margin:0 auto;z-index:6;border-radius:24px;padding:12px 14px 10px;color:#fff;background:linear-gradient(120deg,#ff5c8a,#7a4dff);box-shadow:0 18px 40px -12px rgba(0,0,0,.55)}
#ytbox{position:fixed;top:12px;right:10px;width:200px;height:113px;z-index:7;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4);background:#000;display:none}
#ytbox.on{display:block}
.pl .t{display:flex;align-items:center;gap:12px}
.pl .cv{width:46px;height:46px}.pl .m span{color:rgba(255,255,255,.8)}
.ct{display:flex;align-items:center}.ct button{font-size:20px;padding:8px 9px}
.ct .pp{background:#fff;color:#14101f;border-radius:50%;width:46px;height:46px;font-size:18px;padding:0}
.pg{display:flex;align-items:center;gap:9px;margin-top:8px;font-size:12px;font-variant-numeric:tabular-nums}
.pg input{flex:1;accent-color:#fff;min-height:28px}
.install-bar{position:fixed;top:0;left:0;right:0;z-index:99;padding:12px 18px;background:linear-gradient(135deg,#ff5c8a,#7a4dff);color:#fff;font-weight:600;font-size:14px;display:none;align-items:center;justify-content:space-between;gap:12px}
.install-bar.show{display:flex}
.install-bar button{padding:8px 18px;border-radius:99px;background:#fff;color:#7a4dff;font-weight:700}
.install-bar .x{background:none;color:#fff;font-size:22px;padding:4px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100;padding:10px 22px;border-radius:99px;background:var(--bg2);color:var(--tx);font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.vol-row{display:flex;align-items:center;gap:10px;margin-top:18px;padding:10px 0;font-size:12px}
.vol-row input{flex:1;accent-color:#fff;min-height:28px}

.mode-btn{font-size:16px;padding:6px 8px;opacity:.5;transition:opacity .2s}
.mode-btn.on{opacity:1;color:#fff}
.skel{background:linear-gradient(90deg,var(--bg2) 25%,var(--ln) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px;height:64px;margin:6px 0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pager{display:flex;justify-content:center;gap:8px;margin:16px 0}
.pager button{padding:8px 16px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);font-weight:600}
.pager button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.hist-tag{display:inline-block;padding:4px 12px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);font-size:13px;margin:3px;cursor:pointer}
.hist-tag:hover{border-color:var(--ac);color:var(--ac)}
/* Radio styles */
.radio-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.radio-card{background:var(--bg2);border-radius:20px;padding:20px 16px;text-align:center;cursor:pointer;border:2px solid var(--ln);transition:border-color .2s,transform .15s}
.radio-card:hover{border-color:var(--ac);transform:scale(1.02)}
.radio-card.playing{border-color:var(--ac);box-shadow:0 0 20px -4px var(--ac)}
.radio-card .ricon{font-size:40px;margin-bottom:8px}
.radio-card .rname{font-weight:700;font-size:15px;margin-bottom:4px}
.radio-card .rdesc{color:var(--mu);font-size:12px}
.radio-live{display:inline-block;background:var(--ac);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;margin-left:6px;animation:pulse-live 1.5s infinite}
@keyframes pulse-live{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>

<div class="install-bar" id="installBar">

<div class="wrap">

  <div class="t">

    <div class="m"><b id="pt">Ничего не играет</b><span id="pa">Выберите трек</span></div>

  <button data-v="home" class="on">Главное</button><button data-v="search">Поиск</button><button data-v="tb">🎵 Татар-Башкир</button><button data-v="ch">🎤 Шансон</button><button data-v="tsoi">🎸 Цой</button><button data-v="yt">▶ YouTube</button><button data-v="sp">🟢 Spotify</button><button data-v="radio">Радио</button><button data-v="fav">♡</button><button data-v="hist">История</button>
  <button class="src-toggle" id="srcToggle" title="Источник музыки">🎵 Jamendo</button>

<script>
/* === Jamendo API — полные треки, бесплатно и легально (Creative Commons) === */
const JAMENDO_CLIENT_ID = "32d7ec41";
const API = "https://api.jamendo.com/v3.0";

/* === Audius API === */
const AUDIUS_HOST = "https://discoveryprovider.audius.co";
const AUDIUS_APP = "MusicAlwaysWithMe";
// source will be initialized after ls is defined

async function audiusFetch(path){
  const r = await fetch(AUDIUS_HOST + path + (path.includes("?")?"&":"?") + "app_name=" + AUDIUS_APP);
  if(!r.ok) throw new Error("Audius "+r.status);
  return r.json();
}

function audiusStreamUrl(trackId){
  return AUDIUS_HOST + "/v1/tracks/" + trackId + "/stream?app_name=" + AUDIUS_APP;
}

async function audiusTrending(genre){
  let path = "/v1/tracks/trending?genre=" + (genre ? encodeURIComponent(genre) : "");
  const d = await audiusFetch(path);
  const arr = d.data || d || [];
  return arr.map(t=>({
    id: "au_"+t.id,
    t: t.title,
    a: (t.user && t.user.name) || "Unknown",
    img: (t.artwork && (t.artwork["480x480"]||t.artwork["150x150"])) || "",
    src: audiusStreamUrl(t.id),
    d: Number(t.duration) || 0
  }));
}

async function audiusSearch(query){
  const d = await audiusFetch("/v1/tracks/search?query="+encodeURIComponent(query));
  const arr = d.data || d || [];
  return arr.map(t=>({
    id: "au_"+t.id,
    t: t.title,
    a: (t.user && t.user.name) || "Unknown",
    img: (t.artwork && (t.artwork["480x480"]||t.artwork["150x150"])) || "",
    src: audiusStreamUrl(t.id),
    d: Number(t.duration) || 0
  }));
}
/* === iTunes Search API (30-sec previews, commercial music) === */
async function itunesSearch(query){
  const r = await fetch("https://itunes.apple.com/search?term="+encodeURIComponent(query)+"&limit=50&media=music");
  if(!r.ok) throw new Error("iTunes "+r.status);
  const data = await r.json();
  return (data.results||[]).map(t=>({
    id: "it_"+t.trackId,
    t: t.trackName || "Unknown",
    a: t.artistName || "Unknown",
    img: t.artworkUrl100 || "",
    src: t.previewUrl || "",
    d: Number(t.trackTimeMillis)/1000 || 30
  })).filter(t => t.src); // only tracks with preview
}

/* === Curated search queries (iTunes previews) === */
const TB_QUERIES = [
  "татар музыка", "башкир музыка", "tatar song", "bashkir song", "tatar music",
  "Идрис Газиев", "Salavat", "Башкорт", "Ришат Тухватуллин", "Салават Фатхетдинов",
  "Хания Фархи", "Алсу", "Гузель Уразова", "Ильсия Бадретдинова", "Айгуль Хайруллина",
  "Зыя Кыямова", "Фирдус Тямаев", "Радик Юльякшин", "Ильхам Гимадиев", "татарская эстрада"
];
const CHANSON_QUERIES = [
  "русский шансон", "шансон", "Mikhail Shufutinsky", "Grigory Leps", "Stas Mikhaylov",
  "Butyrka", "Сергей Трофимов", "Alexander Rosenbaum", "Михаил Круг", "Ирина Круг",
  "Александр Новиков", "Владимир Высоцкий", "Любэ", "Лесоповал", "Елена Ваенга",
  "Вадим Казаченко", "Андрей Бандера", "Игорь Растеряев", "Таня Тишинская", "Вилли Токарев"
];
const TSOI_QUERIES = [
  "Виктор Цой", "Виктор Цой Кино", "Tsoi Kino", "Kino группа крови",
  "Kino Звезда по имени Солнце", "Кино Пачка сигарет", "Кино Мы ждём перемен",
  "Кино Кукушка", "Кино Закрой за мной дверь", "Кино Спокойная ночь",
  "ДДТ", "Аквариум", "Наутилус Помпилиус", "Алиса", "Ария", "Сплин", "Би-2", "Мумий Тролль"
];

async function jamendoSearchFull(query){
  const data = await jamendoFetch("tracks/?limit=20&search="+encodeURIComponent(query));
  return (data.results||[]).filter(t=>t.audio).map(t=>({id:String(t.id),t:t.name,a:t.artist_name,img:t.image,src:t.audio,d:Number(t.duration)}));
}
async function loadCurated(queries){
  // full tracks first (Jamendo + Audius), 30-sec iTunes previews only as fallback at the end
  const full = await Promise.all(queries.map(q => Promise.all([jamendoSearchFull(q).catch(()=>[]), audiusSearch(q).catch(()=>[])]).then(r=>r.flat())));
  const prev = await Promise.all(queries.map(q => itunesSearch(q).catch(() => [])));
  const yt = ytKey() ? await Promise.all(queries.slice(0,6).map(q => ytSearch(q,10).catch(() => []))) : [];
  const sp = spLoggedIn() ? await Promise.all(queries.map(q => spSearch(q,8).catch(() => []))) : [];
  const seen = new Set(), combined = [];
  for(const l of [...sp, ...yt, ...full, ...prev]) for(const t of l){
    if(!seen.has(t.id)){ seen.add(t.id); combined.push(t) }
  }
  return combined.slice(0,200);
}
const loadTatarBashkir = () => loadCurated(TB_QUERIES);
const loadChanson = () => loadCurated(CHANSON_QUERIES);
const loadTsoi = () => loadCurated(TSOI_QUERIES);
const GENRES = {"Все":"","Поп":"pop","Рэп":"hiphop","Рок":"rock","Электроника":"electronic","R&B":"rnb","Альтернатива":"alternative","Джаз":"jazz","Классика":"classical","Лаунж":"lounge","Фолк":"folk","Метал":"metal","Реггетон":"reggae","Танцевальная":"dance","Саундтрек":"soundtrack","Мир":"world","Инструментал":"instrumental","Блюз":"blues","Кантри":"country","Хаус":"house","Эмбиент":"ambient","Панк":"punk","Лоу-фай":"lofi","Транс":"trance","Соул":"soul","Фанк":"funk","Латино":"latin"};
const PER_PAGE = 20;
const RADIOS = [
  {id:"rr", name:"Радио Роксана", desc:"Русское радио", src:"https://rrfm.bcradio.ru/live"},
  {id:"rru", name:"Русское Радио", desc:"Москва", src:"https://rrfm.bcradio.ru/rru"},
  {id:"tat", name:"Tatar Radiosi", desc:"Татарское радио 100.5 FM", src:"https://tatarradio.hostingradio.ru/tatarradio320.mp3"},
  {id:"ash", name:"Ашкадар", desc:"Башкирское радио", src:"https://radio.mediacdn.ru/ashkadar.mp3"},
  {id:"yul", name:"Юлдаш", desc:"Башкирское радио", src:"https://radio.mediacdn.ru/uldash.mp3"},
  {id:"mat", name:"Матур Радио", desc:"Башкирское радио", src:"http://radio.matur-tv.ru/radio/radio-mp3-128k"},
  {id:"kit", name:"Милли радио Китап", desc:"Татарское радио", src:"http://radio.tatmedia.com:8800/kitapfm"},
  {id:"shn", name:"Радио Шансон", desc:"Русский шансон 24/7", src:"https://chanson.hostingradio.ru:8041/chanson256.mp3"},
  {id:"eur", name:"Европа Плюс", desc:"Хиты", src:"https://ep256.hostingradio.ru:8052/europaplus256.mp3"},
  {id:"nrj", name:"Energy", desc:"Танцевальная", src:"https://ic7.101.ru:8000/v1_1"},
  {id:"rec", name:"Радио Рекорд", desc:"Электроника", src:"https://radiorecord.hostingradio.ru/rr_main96.aacp"},
  {id:"mx", name:"Максимум", desc:"Рок", src:"https://maximum.hostingradio.ru/maximum96.aacp"},
  {id:"nsh", name:"Наше Радио", desc:"Русский рок", src:"https://nashe1.hostingradio.ru/nashe-128.mp3"},
  {id:"dfm", name:"DFM", desc:"Клубная музыка", src:"https://dfm.hostingradio.ru/dfm96.aacp"},
  {id:"jaz", name:"Радио Jazz", desc:"Джаз", src:"https://nashe.streamr.ru/jazz-128.mp3"}
];
const au = new Audio();
const $ = id => document.getElementById(id);
const fmt = s => isFinite(s) ? Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0") : "0:00";
const ls = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };
let source = ls.get("m-source", "jamendo"); // "jamendo" | "audius"

let mood = "Все", view = "home", list = [], queue = [], cur = -1, radio = false, liveRadio = null;
let favs = ls.get("m-favs",{}), hist = ls.get("m-hist",[]);
let page = 0, totalLoaded = 0, allTracks = [];
let repeatMode = 0, shuffleOn = false;



/* === Громкость === */
au.volume = 0.8;
$("vol").oninput = e => { au.volume = e.target.value/100; if(ytReady) ytPlayer.setVolume(e.target.value); $("volVal").textContent = e.target.value+"%" };

/* === Повтор и перемешивание === */
$("repeatBtn").onclick = () => { repeatMode = (repeatMode+1)%3; $("repeatBtn").classList.toggle("on",repeatMode>0); $("repeatBtn").textContent = repeatMode===2?"🔂":"🔁"; toast(repeatMode===0?"Повтор выкл":repeatMode===1?"Повтор всех":"Повтор одного") };
$("shuffleBtn").onclick = () => { shuffleOn = !shuffleOn; $("shuffleBtn").classList.toggle("on",shuffleOn); toast(shuffleOn?"Перемешивание вкл":"Перемешивание выкл") };

/* === Toast === */
let toastTimer;
function toast(msg){ $("toast").textContent=msg; $("toast").classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2000) }

/* === Jamendo API === */
async function jamendoFetch(endpoint){
  const r = await fetch(API+"/"+endpoint+"&client_id="+JAMENDO_CLIENT_ID+"&format=json&audioformat=mp32&include=musicinfo");
  return r.json();
}
async function loadChart(genre){
  if(source === "audius"){
    const g = genre === "pop" ? "pop" : genre === "hiphop" ? "hip-hop" : genre === "rock" ? "rock" : genre === "electronic" ? "electronic" : "";
    return audiusTrending(g);
  }
  const tag = genre ? `&fuzzytags=${encodeURIComponent(genre)}` : "";
  const data = await jamendoFetch("tracks/?limit=50&order=popularity_total"+tag);
  return (data.results||[]).map(t=>({id:String(t.id),t:t.name,a:t.artist_name,img:t.image,src:t.audio,d:Number(t.duration)}));
}
async function loadSearch(query){

/* === Пагинация === */
function pagerHTML(){
  if(totalLoaded<=PER_PAGE) return "";

  for(let i=0;i<pages&&i<10;i++) h += `<button class="${i===page?"on":""}" data-p="${i}">${i+1}</button>`;
  h += '</div>';
  return h;
}
function bindPager(){
  document.querySelectorAll(".pager button").forEach(b => b.onclick = () => { page=+b.dataset.p; list=paginatedList(allTracks,page); const v=$("view"); const existing=v.querySelector("h2"); v.innerHTML=""; if(existing)v.prepend(existing); v.innerHTML+=rows(list)+pagerHTML(); bindPager(); scrollTo(0,0) });

/* === Spotify (полные треки, нужен Premium) === */
const SP_SCOPES = "streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state";
const spRedirect = () => location.origin + location.pathname;
const spId = () => ls.get("sp-id","");
const spLoggedIn = () => !!ls.get("sp-tok",null);
let spPlayer = null, spDevice = null, spActive = false, spState = null, spStateAt = 0, spEndedFor = null;
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function spLogin(){
  let id = spId();
  if(!id){
    id = (prompt("Вставьте Spotify Client ID (developer.spotify.com/dashboard).\nВ настройках приложения добавьте Redirect URI:\n"+spRedirect())||"").trim();
    if(!id) return;
    ls.set("sp-id",id);
  }
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  ls.set("sp-ver", verifier);
  location.href = "https://accounts.spotify.com/authorize?" + new URLSearchParams({
    client_id:id, response_type:"code", redirect_uri:spRedirect(), scope:SP_SCOPES,
    code_challenge_method:"S256", code_challenge:challenge
  });
}
function spLogout(){
  ls.set("sp-tok",null);
  if(spPlayer){ spPlayer.disconnect(); spPlayer=null; spDevice=null }
  spActive = false; render();
}
async function spTokenRequest(params){
  const r = await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:spId(),...params})});
  if(!r.ok) throw new Error("Spotify auth "+r.status);
  const d = await r.json();
  const old = ls.get("sp-tok",{});
  ls.set("sp-tok",{access:d.access_token,refresh:d.refresh_token||old.refresh,exp:Date.now()+d.expires_in*1000});
}
async function spHandleRedirect(){
  const p = new URLSearchParams(location.search);
  if(!p.get("code")) return;
  const code = p.get("code");
  history.replaceState(null,"",location.pathname);
  view = "sp";
  try{ await spTokenRequest({grant_type:"authorization_code",code,redirect_uri:spRedirect(),code_verifier:ls.get("sp-ver","")}); toast("Spotify подключён") }
  catch(e){ toast("⚠ "+e.message) }
}
async function spToken(){
  const t = ls.get("sp-tok",null);
  if(!t) throw new Error("Spotify: нужен вход");
  if(Date.now() < t.exp-60000) return t.access;
  await spTokenRequest({grant_type:"refresh_token",refresh_token:t.refresh});
  return ls.get("sp-tok").access;
}
async function spApi(path,opts={}){
  const r = await fetch("https://api.spotify.com/v1"+path,{...opts,headers:{Authorization:"Bearer "+await spToken(),"Content-Type":"application/json"}});
  if(r.status===401 && !opts._retry){ const t=ls.get("sp-tok"); t.exp=0; ls.set("sp-tok",t); return spApi(path,{...opts,_retry:1}) }
  if(!r.ok && r.status!==204) throw new Error("Spotify "+r.status);
  return r.status===204 ? null : r.json();
}
async function spSearch(query,limit=50){
  const d = await spApi("/search?type=track&limit="+limit+"&q="+encodeURIComponent(query));
  return ((d.tracks&&d.tracks.items)||[]).map(t=>({
    id:"sp_"+t.id, uri:t.uri, t:t.name, a:t.artists.map(x=>x.name).join(", "),
    img:(t.album.images[1]||t.album.images[0]||{}).url||"", src:"", d:t.duration_ms/1000
  }));
}
function spInitPlayer(){
  if(!spLoggedIn() || spPlayer || window.__spLoading) return;
  window.__spLoading = true;
  window.onSpotifyWebPlaybackSDKReady = () => {
    spPlayer = new Spotify.Player({name:"Музыка всегда с собой", getOAuthToken:cb=>spToken().then(cb).catch(()=>{}), volume:au.volume});
    spPlayer.addListener("ready", ({device_id}) => { spDevice = device_id });
    spPlayer.addListener("not_ready", () => { spDevice = null });
    spPlayer.addListener("account_error", () => toast("⚠ Для Spotify нужен Premium"));
    spPlayer.addListener("authentication_error", () => toast("⚠ Ошибка входа в Spotify"));
    spPlayer.addListener("player_state_changed", st => {
      if(!st || !spActive) return;
      spState = st; spStateAt = Date.now();
      $("pp").textContent = st.paused?"▶":"❚❚";
      $("dur").textContent = fmt(st.duration/1000);
      const id = st.track_window.current_track.id;
      const finished = st.paused && st.position===0 && st.track_window.previous_tracks.some(t=>t.id===id);
      if(finished && spEndedFor!==id){ spEndedFor = id; step(1) }
    });
    spPlayer.connect();
  };
  const sc = document.createElement("script");
  sc.src = "https://sdk.scdn.co/spotify-player.js"; sc.async = true;
  document.head.appendChild(sc);
}
setInterval(() => {
  if(!spActive || !spState || spState.paused) return;
  const pos = spState.position + (Date.now()-spStateAt);
  $("cur").textContent = fmt(pos/1000);
  $("seek").value = Math.min(1000, pos/spState.duration*1000);
}, 500);
async function spPlay(x){
  try{
    spEndedFor = null;
    await spApi("/me/player/play?device_id="+spDevice,{method:"PUT",body:JSON.stringify({uris:[x.uri]})});
  }catch(e){ toast("⚠ "+e.message); }
}
function spStop(){ if(spActive && spPlayer){ spPlayer.pause() } spActive = false }

/* === YouTube (полные треки через встроенный плеер, без Premium) === */
let ytPlayer = null, ytReady = false, ytActive = false, ytPending = null;
const ytKey = () => ls.get("yt-key","");
function ytAskKey(){
  const k = (prompt("Вставьте YouTube Data API key.\nПолучить бесплатно: console.cloud.google.com → APIs → YouTube Data API v3 → Credentials → API key.")||"").trim();

const decodeEnt = t => { const e=document.createElement("textarea"); e.innerHTML=t; return e.value };
async function ytSearch(query,limit=20){
  const ck = "yt-c:"+limit+":"+query, c = ls.get(ck,null);
  if(c && Date.now()-c.at < 12*3600*1000) return c.v;
  const r = await fetch("https://www.googleapis.com/youtube/v3/search?"+new URLSearchParams({part:"snippet",type:"video",videoCategoryId:"10",videoEmbeddable:"true",maxResults:limit,q:query,key:ytKey()}));
  if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error("YouTube: "+((e.error&&e.error.message)||r.status)) }
  const d = await r.json();
  const v = (d.items||[]).map(i=>({
    id:"yt_"+i.id.videoId, yt:i.id.videoId, t:decodeEnt(i.snippet.title), a:decodeEnt(i.snippet.channelTitle),
    img:(i.snippet.thumbnails.medium||i.snippet.thumbnails.default||{}).url||"", src:"", d:0
  }));
  ls.set(ck,{at:Date.now(),v});

function ytInit(){
  if(window.YT && YT.Player){ ytMake(); return }
  if(window.__ytLoading) return;
  window.__ytLoading = true;
  window.onYouTubeIframeAPIReady = ytMake;
  const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
}
function ytMake(){
  if(ytPlayer) return;
  ytPlayer = new YT.Player("ytp",{width:"200",height:"113",playerVars:{playsinline:1,rel:0,origin:location.origin},events:{
    onReady:()=>{ ytReady = true; ytPlayer.setVolume(au.volume*100); if(ytPending){ const v=ytPending; ytPending=null; ytPlayer.loadVideoById(v) } },
    onStateChange:e=>{
      if(!ytActive) return;
      if(e.data===1) $("pp").textContent="❚❚";
      else if(e.data===2) $("pp").textContent="▶";
      else if(e.data===0){ if(repeatMode===2){ ytPlayer.seekTo(0); ytPlayer.playVideo() } else step(1) }
      if(e.data===1) $("dur").textContent = fmt(ytPlayer.getDuration());
    },
    onError:()=>{ toast("⚠ Это видео нельзя воспроизвести, следующее"); if(ytActive) step(1) }
  }});
}
function ytPlay(x){
  ytInit();
  $("ytbox").classList.add("on");
  if(ytReady) ytPlayer.loadVideoById(x.yt); else ytPending = x.yt;
}
function ytStop(){
  if(ytActive && ytPlayer && ytReady) ytPlayer.pauseVideo();
  ytActive = false; ytPending = null; $("ytbox").classList.remove("on");
}
setInterval(() => {
  if(!ytActive || !ytReady || !ytPlayer.getDuration) return;
  const d = ytPlayer.getDuration(); if(!d) return;
  $("cur").textContent = fmt(ytPlayer.getCurrentTime());
  $("seek").value = ytPlayer.getCurrentTime()/d*1000;

/* === Воспроизведение === */
function play(i, from){
  if(from) queue = from;
  cur = i; const x = queue[cur];
  liveRadio = null;
  if(x.yt){
    au.pause(); spStop(); ytActive = true; ytPlay(x);
  } else if(x.uri){
    ytStop();
    if(!spDevice){ toast("Spotify ещё подключается, попробуйте через секунду"); return }
    au.pause(); spActive = true; spPlay(x);
  } else { spStop(); ytStop(); au.src = x.src; au.play().catch(()=>{}); }
  $("pt").textContent = x.t; $("pa").textContent = x.a + (radio?" · Моя волна":"");
  $("pcv").style.backgroundImage = `url('${x.img}')`; $("dur").textContent = fmt(x.d);
  $("plike").textContent = favs[x.id]?"♥":"♡";
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("cur",queue[+r.dataset.i]&&queue[+r.dataset.i].id===x.id&&queue===list));
  if("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({title:x.t,artist:x.a,artwork:[{src:x.img,sizes:"250x250"}]});
  const q = x.a+" "+x.t;
  if(!hist.includes(q)){ hist.unshift(q); if(hist.length>30) hist.pop(); ls.set("m-hist",hist) }
  toast("▶ "+x.t);
}
function step(d){
  if(!queue.length) return;
  if(repeatMode===2){ if(ytActive){ ytPlayer.seekTo(0); ytPlayer.playVideo() } else if(spActive){ spEndedFor=null; spPlayer.seek(0); spPlayer.resume() } else { au.currentTime=0; au.play() } return }
  let next;
  if(shuffleOn){ next=Math.floor(Math.random()*queue.length) }
  else { next = radio ? Math.floor(Math.random()*queue.length) : (cur+d+queue.length)%queue.length }
  play(next);
}
function toggleLike(x){ favs[x.id]?delete favs[x.id]:favs[x.id]=x; ls.set("m-favs",favs); toast(favs[x.id]?"♥ Добавлено в любимое":"Убрано из любимого") }

/* === События плеера === */
au.onplay = au.onpause = () => { $("pp").textContent = au.paused?"▶":"❚❚"; $("waveBtn").textContent = radio&&!au.paused?"Пауза":"Слушать бесплатно" };
au.ontimeupdate = () => { if(liveRadio) return; $("cur").textContent=fmt(au.currentTime); if(au.duration){ $("seek").value=au.currentTime/au.duration*1000; $("dur").textContent=fmt(au.duration) } };
au.onended = () => { if(liveRadio){au.play();return} if(repeatMode===2){au.currentTime=0;au.play();return} step(1) };

/* === Визуализатор === */
const c=$("cv"),g=c.getContext("2d");let ph=0,amp=0;
(function draw(){
  requestAnimationFrame(draw); if(view!=="home") return;
  const W=c.width,H=c.height; g.clearRect(0,0,W,H);
  const on=!au.paused; ph+=on?.02:.005; amp+=((on?1:.2)-amp)*.05;
  const hue = cur>=0 ? (parseInt(queue[cur].id,10)*47)%360 : 335;
  const beat = on ? (Math.sin(ph*9)*.5+.5)*.4 : 0;
  for(let k=3;k>=0;k--){
    g.beginPath();
    for(let i=0;i<=96;i++){
      const t=i/96*Math.PI*2, r=88+beat*22+k*15+Math.sin(t*3+ph*2+k)*(5+amp*18)+Math.cos(t*5-ph)*(3+amp*9);
      const px=W/2+Math.cos(t)*r*1.35, py=H/2+Math.sin(t)*r*.92; i?g.lineTo(px,py):g.moveTo(px,py);
    }
    g.closePath(); g.fillStyle=`hsla(${(hue+k*22)%360},90%,62%,${k===0?.95:.13})`; g.fill();
  }
})();

/* === Service Worker (force update) === */
if("serviceWorker" in navigator){
  // Listen for new SW taking control → reload
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    console.log("SW controller changed → reloading");
    window.location.reload();
  });

  // Register and force update
  navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(reg => {
    console.log("SW registered");
    // Force check for update immediately
    reg.update();
    // If new SW is waiting, force it to activate
    if(reg.waiting){
      console.log("New SW waiting → activating");
      reg.waiting.postMessage("SKIP_WAITING");
    }
    // When a new SW is found and installed, activate it
    reg.addEventListener("updatefound", () => {
      const newSW = reg.installing;
      if(newSW){
        newSW.addEventListener("statechange", () => {
          if(newSW.state === "installed" && navigator.serviceWorker.controller){
            console.log("New SW installed → activating");
            newSW.postMessage("SKIP_WAITING");
          }
        });
      }
    });
  }).catch(e => console.log("SW fail:", e));
}

/* === Dynamic sky theme + Source toggle === */
/* === Dynamic sky theme based on time of day === */
/* === Тема дня: цвета и узор фона меняются каждый день === */
const PATTERNS = [
  ov => `repeating-conic-gradient(from 0deg at 50% 35%, transparent 0deg 6deg, ${ov} 6deg 9deg)`,
  ov => `radial-gradient(circle, ${ov} 2px, transparent 2.5px) 0 0/26px 26px`,
  ov => `repeating-linear-gradient(45deg, transparent 0 18px, ${ov} 18px 36px)`,
  ov => `repeating-radial-gradient(circle at 50% 35%, transparent 0 44px, ${ov} 44px 88px)`,
  ov => `linear-gradient(${ov} 1px, transparent 1px) 0 0/32px 32px, linear-gradient(90deg, ${ov} 1px, transparent 1px) 0 0/32px 32px`,
  ov => `repeating-linear-gradient(-30deg, transparent 0 14px, ${ov} 14px 16px)`
];
function applySkyTheme(){
  const now = new Date();
  // номер дня по местному календарю → разные оттенок, насыщенность и узор каждый день
  const day = Math.floor(new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime()/86400000 - now.getTimezoneOffset()/1440);
  const hue = Math.round((day*137.508) % 360);
  const hue2 = (hue + 140 + (day%3)*30) % 360;
  const sat = 45 + (day%4)*10;
  const h = now.getHours();
  const dark = h < 6 || h >= 18;
  const t = dark
    ? { bg:`hsl(${hue} ${sat}% 9%)`, bg2:`hsl(${hue} ${sat}% 17%)`, tx:`hsl(${hue} 40% 94%)`, mu:`hsl(${hue} 25% 70%)`, ln:'rgba(255,255,255,.09)', ov:'rgba(255,255,255,.06)' }
    : { bg:`hsl(${hue} ${sat+15}% 80%)`, bg2:`hsl(${hue} ${sat+15}% 90%)`, tx:`hsl(${hue} 50% 11%)`, mu:`hsl(${hue} 30% 30%)`, ln:'rgba(0,0,0,.12)', ov:'rgba(0,0,0,.07)' };
  const ac = `hsl(${hue2} 80% ${dark?60:44}%)`;
  const r = document.documentElement.style;
  r.setProperty('--bg', t.bg); r.setProperty('--bg2', t.bg2);
  r.setProperty('--tx', t.tx); r.setProperty('--mu', t.mu);
  r.setProperty('--ac', ac); r.setProperty('--ln', t.ln);
  r.setProperty('--pat', PATTERNS[day % PATTERNS.length](t.ov));
  r.setProperty('--sun-color', ac);
  r.setProperty('--sun-glow', `hsl(${hue2} 90% 60% / .5)`);
  r.setProperty('--stripe-color', t.ov);
  r.setProperty('--sky-top', t.bg); r.setProperty('--sky-bottom', t.bg2);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.content = t.bg);
}
applySkyTheme();
setInterval(applySkyTheme, 5*60*1000);
